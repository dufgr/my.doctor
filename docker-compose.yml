name: my-doctor

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: my_doctor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: my-doctor-local
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - my_doctor_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d my_doctor"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  my_doctor_postgres_data:
